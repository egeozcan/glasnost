[package]
name = "glasnost-headless-web"
description = "Glasnost's soak client built for wasm32 (M9 N6): the game client played by our AI over the browser WebSocket link, run under node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glasnost-app.workspace = true
glasnost-vfs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's WebSocket link, without the page's entry point.
glasnost-platform-web = { path = "../platform-web", default-features = false }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
