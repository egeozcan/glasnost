# The lockstep crate has no I/O (docs/m9-plan.md, N1): the caller passes its
# clock in and moves the bytes. Clippy finds this file from the crate's
# manifest directory; the workspace lint table (`all = warn`) and CI's
# `-D warnings` make every entry an error.

disallowed-types = [
    { path = "std::time::Instant", reason = "the session takes the caller's clock (now_ms)" },
    { path = "std::time::SystemTime", reason = "the session takes the caller's clock (now_ms)" },
    { path = "std::thread::JoinHandle", reason = "the session is single-threaded" },
    { path = "std::thread::Builder", reason = "the session is single-threaded" },
    { path = "std::sync::Mutex", reason = "the session is single-threaded" },
    { path = "std::sync::RwLock", reason = "the session is single-threaded" },
    { path = "std::net::TcpStream", reason = "transports live in the client and the relay" },
    { path = "std::net::TcpListener", reason = "transports live in the client and the relay" },
    { path = "std::net::UdpSocket", reason = "transports live in the client and the relay" },
    { path = "std::fs::File", reason = "no I/O in the lockstep core" },
    { path = "std::collections::HashMap", reason = "iteration order depends on hashing; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order depends on hashing; use BTreeSet" },
]

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "the session takes the caller's clock (now_ms)" },
    { path = "std::time::SystemTime::now", reason = "the session takes the caller's clock (now_ms)" },
    { path = "std::thread::spawn", reason = "the session is single-threaded" },
    { path = "std::thread::sleep", reason = "the session never waits" },
]
