[package]
name = "glasnost-ai"
description = "Glasnost computer opponent (produces Orders only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glasnost-rules.workspace = true
glasnost-map.workspace = true
glasnost-num.workspace = true
glasnost-sim.workspace = true
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

# Simulation crate: determinism lints. The disallowed types, methods and macros
# are listed in ../clippy.toml, which clippy finds by walking up from this
# directory. Keep this table identical across crates/deterministic/*
# (checked by `cargo xtask check`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_precision_loss = "deny"
