[package]
name = "glasnost-platform-web"
description = "Glasnost browser entry point (wasm32-unknown-unknown)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# `start`: the page's entry point (the demo, the viewer, the game). The
# soak's wasm client (glasnost-headless-web, M9 N6) uses this crate's
# WebSocket link without it.
[features]
default = ["start"]
start = []

[dependencies]
glasnost-app.workspace = true
glasnost-net.workspace = true
glasnost-render.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "Blob", "BlobPropertyBag", "CloseEvent", "Document", "Element", "Event", "HtmlAnchorElement", "HtmlElement", "Location", "MessageEvent", "RtcConfiguration", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelState", "RtcDataChannelType", "RtcIceCandidate", "RtcIceCandidateInit", "RtcPeerConnection", "RtcPeerConnectionIceEvent", "RtcPeerConnectionState", "RtcSdpType", "RtcSessionDescription", "RtcSessionDescriptionInit", "Url", "UrlSearchParams", "WebSocket", "Window"] }

[lints]
workspace = true
