[package]
name = "glasnost-audio"
description = "Glasnost audio: sample bank, software mixer, sound events and output backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Native in-process output: streams the software mix to a command-line
# player's standard input (`pw-cat`, `pacat` or `aplay`). Off by default; the
# default build and every test need no audio device. See docs/development.md,
# "Audio (M5b)".
native-output = []

[dependencies]
glasnost-fmt.workspace = true
glasnost-ini.workspace = true
glasnost-rules.workspace = true
glasnost-sim.workspace = true
glasnost-vfs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioScheduledSourceNode", "BaseAudioContext", "Event", "EventTarget", "Window"] }

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
