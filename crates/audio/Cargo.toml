[package]
name = "glasnost-audio"
description = "Glasnost audio: sample bank, software mixer, sound events and output backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Native device output through cpal (ALSA on Linux, WASAPI on Windows,
# CoreAudio on macOS). Off here; the desktop game (glasnost-platform-native,
# feature `audio`) turns it on. On Linux it needs the ALSA development
# package. Even with it on, a device opens only in a program that calls
# `output::allow_device`, so tests never open one. See
# docs/development.md, "Audio (M5b)".
device = ["dep:cpal"]

[dependencies]
glasnost-fmt.workspace = true
glasnost-ini.workspace = true
glasnost-rules.workspace = true
glasnost-sim.workspace = true
glasnost-vfs.workspace = true
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.18.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioScheduledSourceNode", "BaseAudioContext", "Event", "EventTarget", "Window"] }

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
