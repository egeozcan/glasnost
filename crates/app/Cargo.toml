[package]
name = "glasnost-app"
description = "Glasnost application shell shared by the native and web builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glasnost-fmt.workspace = true
glasnost-render.workspace = true
log = "0.4"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "DomStringMap", "Element", "HtmlElement", "Window"] }

[lints]
workspace = true
