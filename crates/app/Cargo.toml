[package]
name = "glasnost-app"
description = "Glasnost application shell shared by the native and web builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glasnost-audio.workspace = true
glasnost-convert.workspace = true
glasnost-ini.workspace = true
glasnost-map.workspace = true
glasnost-num.workspace = true
glasnost-rules.workspace = true
glasnost-sim.workspace = true
glasnost-ai.workspace = true
glasnost-fmt.workspace = true
glasnost-render.workspace = true
glasnost-vfs.workspace = true
glasnost-ui.workspace = true
# The lockstep session and the lobby's messages (no I/O of their own).
glasnost-net.workspace = true
# Development UI (PLAN.md 4.1). Default features off: egui's bundled fonts
# carry licences outside our policy, so the viewer ships its own font.
egui = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
log = "0.4"
# The pathing report's file (M8 A4): postcard body, SHA-256 checksum.
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
# The native client's WebSocket to the relay, on its own thread (M9 N3);
# ws:// and wss:// (TLS by rustls with the ring provider and the system's
# trusted roots, M9 N8b). The browser uses its own WebSocket
# (glasnost-platform-web).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The native client's direct links to the other peers (M9 N7): WebRTC data
# channels through matchbox and webrtc-rs. The browser uses its own
# RTCPeerConnection (glasnost-platform-web).
glasnost-rtc.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "DomStringMap", "Element", "File", "FileList", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions", "FileSystemHandle", "FileSystemWritableFileStream", "HtmlElement", "HtmlInputElement", "Navigator", "Performance", "Storage", "StorageManager", "Window", "WritableStream"] }

[lints]
workspace = true

[dev-dependencies]
pollster = "0.4"

# The client's network tests run a real relay in the test process.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glasnost-relay = { path = "../relay" }
tokio = { version = "1", features = ["rt-multi-thread"] }
