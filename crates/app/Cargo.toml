[package]
name = "glasnost-app"
description = "Glasnost application shell shared by the native and web builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glasnost-audio.workspace = true
glasnost-convert.workspace = true
glasnost-ini.workspace = true
glasnost-map.workspace = true
glasnost-num.workspace = true
glasnost-rules.workspace = true
glasnost-sim.workspace = true
glasnost-ai.workspace = true
glasnost-fmt.workspace = true
glasnost-render.workspace = true
glasnost-vfs.workspace = true
glasnost-ui.workspace = true
# The lockstep session and the lobby's messages (no I/O of their own).
glasnost-net.workspace = true
# Development UI (PLAN.md 4.1). Default features off: egui's bundled fonts
# carry licences outside our policy, so the viewer ships its own font.
egui = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
log = "0.4"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
# The native client's WebSocket to the relay, on its own thread (M9 N3);
# plain ws:// only. The browser uses its own WebSocket (glasnost-platform-web).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "DomStringMap", "Element", "File", "FileList", "HtmlElement", "HtmlInputElement", "Performance", "Window"] }

[lints]
workspace = true

[dev-dependencies]
pollster = "0.4"

# The client's network tests run a real relay in the test process.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glasnost-relay = { path = "../relay" }
tokio = { version = "1", features = ["rt-multi-thread"] }
