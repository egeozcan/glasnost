[package]
name = "glasnost-platform-native"
description = "Glasnost native desktop entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "glasnost"
path = "src/main.rs"

[features]
# Sound through the system's audio device (cpal; on Linux it needs the ALSA
# development package: alsa-lib-devel on Fedora, libasound2-dev on Debian
# and Ubuntu). `--no-default-features` builds a silent game that needs no
# system audio headers.
default = ["audio"]
audio = ["glasnost-audio/device"]

[dependencies]
glasnost-app.workspace = true
glasnost-audio.workspace = true
glasnost-render.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[lints]
workspace = true
