# cargo-fuzz targets for glasnost-fmt (PLAN.md 6.2, layer 0). Needs a
# nightly toolchain and cargo-fuzz; not part of the workspace or CI.
# See fuzz/README.md.
[package]
name = "glasnost-fmt-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
glasnost-fmt = { path = "../crates/fmt" }

# Its own workspace, so the main workspace's toolchain pin and lints do not
# apply and `cargo test --workspace` never builds it.
[workspace]

[[bin]]
name = "mix"
path = "fuzz_targets/mix.rs"
test = false
doc = false
bench = false

