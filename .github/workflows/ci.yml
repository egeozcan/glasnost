# Continuous integration. Uses only synthetic data: no game files, no stock
# values, no install paths (CONTRIBUTING.md, "No EA bytes, anywhere").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run, so the optional WebGPU lane below is still exercised.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy (native and wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The desktop game's sound (cpal, feature `audio` of
      # glasnost-platform-native) links ALSA.
      - name: Install the ALSA development package
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: clippy, whole workspace (simulation crates use crates/deterministic/clippy.toml)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # An explicit list: glasnost-relay (a native tokio server) and
      # glasnost-net stay out of the wasm32 lint; `cargo xtask deps` keeps
      # the relay out of the client's graph.
      - name: clippy, wasm32 (web crates and simulation crates)
        run: >-
          cargo clippy --locked --target wasm32-unknown-unknown
          -p glasnost-platform-web -p glasnost-headless-web
          -p glasnost-app -p glasnost-render -p glasnost-fmt
          -p glasnost-vfs -p glasnost-audio
          -p glasnost-sim -p glasnost-ai -p glasnost-map -p glasnost-rules
          -p glasnost-num -p glasnost-sim-gate
          -- -D warnings

  test:
    name: tests (with a software GPU)
    runs-on: ubuntu-24.04
    env:
      # Fail, rather than skip, GPU tests when no adapter is found.
      GLASNOST_REQUIRE_GPU: "1"
      # Test binaries without line tables, for CI only (Cargo.toml keeps
      # them for local builds). The workspace links about 280 test binaries,
      # each with the simulation statically inside: `cargo test --no-run`
      # left a 14 GB target/ with line tables and 6.7 GB without, and the
      # runner has about 14 GB free. Panics still name their functions.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      # Preinstalled toolchains this job never uses; frees well over 20 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Install lavapipe (software Vulkan) for the offscreen render test, and ALSA's development package for the desktop game's sound
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Disk left after the tests
        if: always()
        run: df -h /

  repo-checks:
    name: dependency rule, determinism, citations, no stock numbers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # deps, determinism, cite, stock-guard and the clippy canary.
      - run: cargo xtask check

  gate:
    name: determinism gate (native and wasm32 replay hashes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gate

  licenses:
    name: dependency licences (GPL-3.0-or-later compatible)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses bans sources

  wasm:
    name: web build (wasm32-unknown-unknown)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - run: cargo xtask web --release
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: dist/web
          retention-days: 7

  # Browser lane (PLAN.md 6.2, layer 3): the WebGL2 lane is mandatory from M0.
  browser-webgl2:
    name: browser lane, WebGL2 (${{ matrix.browser }})
    needs: wasm
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Headless Firefox (Playwright 1.63, Firefox 155) creates no WebGL
        # context even with Mesa installed ("Exhausted GL driver options");
        # headed under Xvfb it gets Mesa's llvmpipe. Xvfb comes with
        # `playwright install --with-deps`.
        include:
          - browser: firefox
            launch: xvfb-run -a
            headed: --headed
    # WebKit has not been verified yet (it needs system packages the dev
    # machine lacks); make it blocking once it has run green here.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: dist/web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - working-directory: web-tests
        run: npm ci
      - working-directory: web-tests
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - working-directory: web-tests
        run: ${{ matrix.launch }} node smoke.mjs --browser ${{ matrix.browser }} --backend webgl2 ${{ matrix.headed }}
      # Asset viewer: imports the synthetic MIX fixtures through the folder input.
      - working-directory: web-tests
        run: ${{ matrix.launch }} node smoke.mjs --browser ${{ matrix.browser }} --backend webgl2 --viewer ${{ matrix.headed }}
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot-webgl2-${{ matrix.browser }}
          path: web-tests/out
          if-no-files-found: ignore

  # Optional, non-blocking: WebGPU through Chromium's software Vulkan path.
  # The first run checks the runtime choice (auto must pick WebGPU when the
  # browser offers it), the second the forced backend.
  browser-webgpu:
    name: browser lane, WebGPU (optional)
    needs: wasm
    # Off push and pull_request: on a GitHub runner (no GPU) Chromium presents
    # with WebGPU but the canvas reads back all white on every run (the frame
    # reaches neither the screenshot nor the dark clear colour). The same step
    # passes headless on a machine with a GPU, so the fault is the runner's
    # software Vulkan path, not the app. Run it by hand (workflow_dispatch) or
    # on the weekly schedule instead of leaving every push red.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: dist/web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - working-directory: web-tests
        run: npm ci
      - working-directory: web-tests
        run: npx playwright install --with-deps chromium
      - working-directory: web-tests
        run: node smoke.mjs --browser chromium --backend auto --webgpu --expect WebGPU
      - working-directory: web-tests
        run: node smoke.mjs --browser chromium --backend webgpu
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot-webgpu-chromium
          path: web-tests/out
          if-no-files-found: ignore
